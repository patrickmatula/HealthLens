services:
  healthlens:
    image: ghcr.io/patrickmatula/healthlens:latest
    # To build from source instead of pulling, comment out "image" above and uncomment this:
    # build: .
    ports:
      - "${HEALTHLENS_PORT:-8080}:8080"
    volumes:
      - healthlens-data:/app/App_Data
    restart: unless-stopped

volumes:
  healthlens-data:
